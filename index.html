/* form sync */
V.sync=()=>{const l=D.syncInfo,fm=D.users.filter(u=>u.src=='form').sort((a,b)=>b.t-a.t);
return `<div class="wrap"><div class="ban"><h2>Google Form sync</h2><p>Everyone who fills your registration form gets a job seeker account automatically.</p></div><div class="two"><div>
<div class="card"><h3 class="mb">Your responses sheet</h3><p class="mut">The free Apps Script backend reads your sheet privately every hour, and instantly when a form respondent tries to log in. The sheet does not need to be public.</p><div class="row"><button data-a="syncnow">Sync now</button></div></div>
<div class="card"><h3 class="mb">How accounts are created</h3><ol style="padding-left:18px;margin:0"><li>The form needs an <b>Email</b> question. Name, mobile, city, skills, qualification, experience and salary are matched by their wording.</li><li>New emails become job seeker accounts marked <b>Yantriki Verified</b>. Existing emails are skipped. No OTP is needed for form respondents.</li><li>Login: their <b>email</b> and their <b>mobile number</b> as the first password. They are forced to set a new password at first login.</li><li>If a respondent gave no valid mobile number, they use <b>Forgot password</b> on the login page.</li></ol></div></div>
<div><div class="card"><h3 class="mb">Last sync</h3>${l?`<p>${fdt(l.t)}</p>${l.err?`<div class="note" style="background:#fbe0e0">${e(l.err)}</div>`:`<div class="g3"><div class="stat c"><b>${l.created}</b><span>created</span></div><div class="stat c"><b>${l.skipped}</b><span>skipped</span></div><div class="stat c"><b>${fm.length}</b><span>total from form</span></div></div>`}`:'<p class="mut">No sync has run yet.</p>'}</div>
${l&&l.heads?`<div class="card"><h3 class="mb">Detected columns</h3><table><tr><th>Form question</th><th>Mapped to</th></tr>${l.heads.map((h,i)=>`<tr><td>${e(h)}</td><td>${l.map&&l.map[i]?`<span class="chip t">${l.map[i]}</span>`:'<span class="mut">Saved as extra detail</span>'}</td></tr>`).join('')}</table></div>`:''}
<div class="card" style="overflow-x:auto"><h3 class="mb">Registered through the form (${fm.length})</h3><table><tr><th>Name</th><th>Email</th><th>City</th><th>Added</th></tr>${fm.slice(0,12).map(u=>`<tr><td>${e(u.name)}</td><td>${e(u.email)}</td><td>${e((u.r||{}).city||'')}</td><td>${ago(u.t)}</td></tr>`).join('')||'<tr><td colspan=4 class="mut">No form registrations yet.</td></tr>'}</table></div></div></div></div>`};
A.syncnow=async()=>{toast('Syncing…');const r=await api('syncForm',{},true);toast(r.err||`${r.created} account(s) created, ${r.skipped} skipped`)};
/* approvals */
V.approvals=()=>{const pn=D.conns.filter(c=>c.st=='pending'),dn2=D.conns.filter(c=>c.st!='pending'),nm=c=>`${e(who(by(c.a)))} ⇄ ${e(who(by(c.b)))}`;
return `<div class="wrap"><div class="ban"><div class="row"><div class="sp"><h2>Connections</h2><p>${D.cfg.autoConn?'Auto-accept is ON in platform settings.':'Users accept or decline each other\'s requests. You can step in when needed.'}</p></div>${pn.length?'<button class="o" data-a="appall">Approve all</button>':''}</div></div>${pn.map(c=>`<div class="card row"><b class="sp">${nm(c)}<span class="mut" style="display:block;font-weight:400">${ago(c.t)}</span></b><button data-a="decide" data-id="${c.id}:approved">Approve</button><button class="r" data-a="decide" data-id="${c.id}:rejected">Reject</button></div>`).join('')||emp('No pending requests.')}${dn2.length?`<h3 class="mt mb">History</h3>${dn2.map(c=>`<div class="card row"><span class="sp">${nm(c)}</span><span class="chip ${c.st=='approved'?'t':'b'}">${c.st}</span></div>`).join('')}`:''}</div>`};
A.decide=s=>{const[i,st]=s.split(':'),c=D.conns.find(c=>c.id==i);c.st=st;[c.a,c.b].forEach(u=>note(u,`Your connection with ${who(by(u==c.a?c.b:c.a))} was ${st}.`,'chats'));logA(`${st} connection ${who(by(c.a))} and ${who(by(c.b))}`);save();render()};
A.appall=()=>{const p=D.conns.filter(c=>c.st=='pending');p.forEach(c=>{c.st='approved';[c.a,c.b].forEach(u=>note(u,`Your connection with ${who(by(u==c.a?c.b:c.a))} was approved.`,'chats'))});logA(`Approved ${p.length} connections`);save();render()};
/* users */
let UF={q:'',role:'',src:'',stat:''};
V.users=()=>{const l=D.users.filter(u=>u.role!='admin'&&(!UF.role||u.role==UF.role)&&(!UF.src||(UF.src=='form')==(u.src=='form'))&&(!UF.stat||(UF.stat=='sus'?u.sus:UF.stat=='ver'?u.verified:!u.verified&&u.role=='employee'))&&(!UF.q||(who(u)+u.email+u.name+(u.atag||'')).toLowerCase().includes(UF.q.toLowerCase())));
return `<div class="wrap"><div class="ban"><div class="row"><div class="sp"><h2>Users</h2><p>${D.users.length-1} accounts on this device.</p></div><button class="o" data-a="uadd">Add user</button></div></div>
<form class="row mb" data-f="uf" data-auto><input name="q" value="${e(UF.q)}" placeholder="Search name, email or tag" style="max-width:260px;margin:0"><select name="role" data-auto style="max-width:150px;margin:0"><option value="">All roles</option><option value="employee" ${UF.role=='employee'?'selected':''}>Job seekers</option><option value="employer" ${UF.role=='employer'?'selected':''}>Employers</option></select><select name="src" data-auto style="max-width:150px;margin:0"><option value="">Any source</option><option value="form" ${UF.src=='form'?'selected':''}>Google Form</option><option value="own" ${UF.src=='own'?'selected':''}>Sign-up</option></select><select name="stat" data-auto style="max-width:160px;margin:0"><option value="">Any status</option><option value="ver" ${UF.stat=='ver'?'selected':''}>Verified</option><option value="unv" ${UF.stat=='unv'?'selected':''}>Not verified</option><option value="sus" ${UF.stat=='sus'?'selected':''}>Suspended</option></select><button>Search</button><span class="sp"></span><button type="button" class="g" data-a="xlu">Export Excel</button></form>
<div class="card" style="overflow-x:auto"><div class="row mb"><span class="mut">With selected:</span><button class="g s" data-a="ubulk" data-id="ver">Verify</button><button class="g s" data-a="ubulk" data-id="sus">Suspend</button><button class="g s" data-a="ubulk" data-id="note">Send notification</button><button class="g s" data-a="ubulk" data-id="del" style="color:var(--bad)">Delete</button></div>
<table><tr><th></th><th>Name</th><th>Email</th><th>Role</th><th>Source</th><th>Joined</th><th>Actions</th></tr>${l.map(u=>`<tr><td><input type="checkbox" class="uk" value="${u.id}"></td><td>${e(who(u))} ${u.verified?'<span class="chip t">Verified</span>':''}${u.sus?'<span class="chip b">Suspended</span>':''}${u.delAt?`<span class="chip y">Deletes ${fd(u.delAt)}</span>`:''}${u.atag?`<span class="chip y">${e(u.atag)}</span>`:''}</td><td>${e(u.email)}</td><td>${u.role}</td><td>${u.src=='form'?'Google Form':'Sign-up'}</td><td>${ago(u.t)}</td><td><div class="row"><button class="g s" data-a="udet" data-id="${u.id}">View</button><button class="g s" data-a="uedit" data-id="${u.id}">Edit</button><button class="g s" data-a="rpw" data-id="${u.id}">Reset password</button></div></td></tr>`).join('')||'<tr><td colspan=7 class="mut">No users match.</td></tr>'}</table></div></div>`};
F.uf=f=>{const g=new FormData(f);UF={q:g.get('q'),role:g.get('role'),src:g.get('src'),stat:g.get('stat')};render()};
const sel2=()=>[...document.querySelectorAll('.uk:checked')].map(x=>x.value);
A.ubulk=async k=>{const ids=sel2();if(!ids.length)return toast('Select users first');
if(k=='note'){const m=prompt('Notification message for '+ids.length+' user(s)');if(!m)return;ids.forEach(i=>note(i,m,'dash'));logA(`Sent notification to ${ids.length} user(s)`);save();return toast('Sent')}
if(k=='del'&&!confirm('Delete '+ids.length+' user(s) and their data permanently?'))return;
if(k=='ver'){ids.forEach(i=>{by(i).verified=true;note(i,'Your profile is now Yantriki Verified.','profile')});logA(`Verified ${ids.length} user(s)`);save();return toast('Done')}
toast('Working…');for(const i of ids)await api('admin',{op:k=='sus'?'suspend':'delete',uid:i},true);logA(`Bulk ${k} on ${ids.length} user(s)`);save();toast('Done')};
A.uadd=()=>dlg(`<h3 style="font-size:22px" class="mb">Add a user</h3><form data-f="uadd"><div class="g2"><div><label>Account type</label><select name="role"><option value="employee">Job seeker</option><option value="employer">Employer</option></select></div><div><label>Full name</label><input name="name" required></div><div><label>Company (employers)</label><input name="company"></div><div><label>Email</label><input name="email" type="email" required></div></div><label>Temporary password (min 6)</label><input name="pw" required minlength="6"><div class="row"><button>Create account</button>${xb}</div></form>`);
F.uadd=async f=>{const g=new FormData(f);toast('Creating…');await api('admin',{op:'create',role:g.get('role'),name:g.get('name'),company:g.get('company'),email:g.get('email'),password:g.get('pw')},true);logA(`Created ${g.get('role')} ${g.get('name')}`);save();$('dlg').close();toast('Account created')};
A.uedit=i=>{const u=by(i);dlg(`<h3 style="font-size:22px" class="mb">Edit ${e(who(u))}</h3><form data-f="uedit" data-id="${i}"><div class="g2"><div><label>Name</label><input name="name" value="${e(u.name)}"></div>${u.role=='employer'?`<div><label>Company</label><input name="company" value="${e(u.company)}"></div>`:''}<div><label>Admin tag</label><input name="atag" value="${e(u.atag)}" placeholder="e.g. VIP, follow-up"></div></div><label>Private admin note</label><textarea name="anote">${e(u.anote)}</textarea><div class="row"><button>Save</button>${xb}</div></form>`)};
F.uedit=f=>{const u=by(f.dataset.id),d=Object.fromEntries(new FormData(f));if(d.email)d.email=d.email.toLowerCase();Object.assign(u,d);if(u.role=='employee'&&u.r)u.r.name=u.r.name||u.name;logA(`Edited ${who(u)}`);save();$('dlg').close();toast('Saved');render()};
A.udet=i=>{const u=by(i),ap=D.apps.filter(a=>a.uid==i);dlg(u.role=='employee'?`<div class="row mb"><h3 class="sp" style="font-size:22px">${e(u.name)}</h3>${ring(comp(u),48)}</div><p class="mut">${e(u.email)} · joined ${fd(u.t)} · ${ap.length} applications${u.anote?' · note: '+e(u.anote):''}</p>${ap.map(a=>`<span class="chip" style="background:${STC[a.st]}22;color:${STC[a.st]}">${e((jb(a.jobId)||{}).title)}: ${a.st}</span>`).join('')}${resHtml(u)}<div class="row mt"><button class="g" data-a="ver" data-id="${i}">${u.verified?'Remove verification':'Mark verified'}</button><button class="g" data-a="sus" data-id="${i}">${u.sus?'Reinstate':'Suspend'}</button><button class="r" data-a="udel" data-id="${i}">Delete</button>${xb}</div>`
:`<h3 style="font-size:22px" class="mb">${e(who(u))}</h3><p class="mut">${e(u.email)} · joined ${fd(u.t)}${u.anote?' · note: '+e(u.anote):''}</p><p>${e(u.about||'')}</p>${D.jobs.filter(j=>j.eid==i).map(j=>`<p>• ${e(j.title)} <span class="chip n">${isOpen(j)?'Open':j.st}</span> ${D.apps.filter(a=>a.jobId==j.id).length} applicants</p>`).join('')||'<p class="mut">No jobs.</p>'}<div class="row mt"><button class="g" data-a="ver" data-id="${i}">${u.verified?'Remove verified badge':'Mark company verified'}</button><button class="g" data-a="sus" data-id="${i}">${u.sus?'Reinstate':'Suspend'}</button><button class="r" data-a="udel" data-id="${i}">Delete</button>${xb}</div>`)};
A.ver=i=>{const u=by(i);u.verified=!u.verified;if(u.verified)note(i,u.role=='employer'?'Your company is now Yantriki Verified.':'Your profile is now Yantriki Verified.',u.role=='employer'?'mycompany':'profile');logA(`${u.verified?'Verified':'Unverified'} ${who(u)}`);save();$('dlg').open&&$('dlg').close();render()};
A.sus=async i=>{const u=by(i);await api('admin',{op:u.sus?'unsuspend':'suspend',uid:i},true);logA(`${u.sus?'Reinstated':'Suspended'} ${who(u)}`);save();$('dlg').open&&$('dlg').close();toast('Done')};
A.udel=async i=>{if(!confirm('Delete this user and all related data permanently?'))return;const n=who(by(i));await api('admin',{op:'delete',uid:i},true);logA(`Deleted ${n}`);save();$('dlg').open&&$('dlg').close();toast('Deleted')};
A.rpw=async i=>{const r=await api('admin',{op:'resetlink',uid:i},true);dlg(`<h3 style="font-size:22px" class="mb">Password reset link</h3><p class="mut">Send this link to ${e(who(by(i)))} (${e(r.email)}). It lets them choose a new password.</p><input value="${e(r.link)}" readonly onclick="this.select()"><div class="row">${xb}</div>`);logA(`Generated password reset link for ${who(by(i))}`);save()};
A.xlu=()=>xl('yantriki-users',{Users:[['Name','Email','Role','Source','City','Skills','Experience (yrs)','Expected salary','Verified','Joined'],...D.users.filter(u=>u.role!='admin').map(u=>{const r=u.r||{};return[who(u),u.email,u.role,u.src=='form'?'Google Form':'Sign-up',r.city||u.city||'',r.skills||'',r.yrs??'',r.pexp||'',u.verified?'Yes':'No',fd(u.t)]})]});
/* jobs moderation */
V.jobsm=()=>{const pn=D.jobs.filter(j=>j.st=='pending'),rp=(D.reports||[]).filter(r=>r.open);
return `<div class="wrap"><div class="ban"><h2>Jobs and moderation</h2><p>Approve new listings, review reports and manage featured jobs.</p></div>
${pn.length?`<div class="card"><h3 class="mb">Awaiting approval (${pn.length})</h3>${pn.map(j=>`<div class="row" style="padding:8px 0;border-top:1px solid var(--ln)"><div class="sp"><b>${e(j.title)}</b><div class="mut">${e(who(by(j.eid)))} · ${e(j.loc)}</div></div><button class="s" data-a="japp" data-id="${j.id}:open">Approve</button><button class="g s" data-a="go" data-id="jd:${j.id}">Preview</button><button class="r s" data-a="japp" data-id="${j.id}:closed">Reject</button></div>`).join('')}</div>`:''}
${rp.length?`<div class="card"><h3 class="mb">Reports (${rp.length})</h3>${rp.map(r=>r.kind=='user'?`<div class="row" style="padding:8px 0;border-top:1px solid var(--ln)"><div class="sp"><b>User: ${e(who(by(r.uid)))}</b><div class="mut">Reported by ${e(who(by(r.by)))} · ${ago(r.t)}</div></div><button class="g s" data-a="rdis" data-id="${r.id}">Dismiss</button><button class="g s" data-a="udet" data-id="${r.uid}">View</button><button class="r s" data-a="sus" data-id="${r.uid}">Suspend</button></div>`:`<div class="row" style="padding:8px 0;border-top:1px solid var(--ln)"><div class="sp"><b>${e((jb(r.jid)||{}).title||'Deleted job')}</b><div class="mut">Job reported ${ago(r.t)}</div></div><button class="g s" data-a="rdis" data-id="${r.id}">Dismiss</button><button class="r s" data-a="del" data-id="${r.jid}">Remove job</button></div>`).join('')}</div>`:''}
<div class="card" style="overflow-x:auto"><div class="row mb"><h3 class="sp">All jobs (${D.jobs.length})</h3><button class="g s" data-a="xlj">Export Excel</button></div><table><tr><th>Job</th><th>Company</th><th>Status</th><th>Views</th><th>Applicants</th><th>Actions</th></tr>${[...D.jobs].sort((a,b)=>b.t-a.t).map(j=>`<tr><td><a data-a="go" data-id="jd:${j.id}">${e(j.title)}</a> ${j.feat?'<span class="chip c">Featured</span>':''}</td><td>${e(who(by(j.eid)))}</td><td>${isOpen(j)?'Open':e(j.st)}</td><td>${j.views||0}</td><td>${D.apps.filter(a=>a.jobId==j.id).length}</td><td><div class="row"><button class="g s" data-a="feat" data-id="${j.id}">${j.feat?'Unfeature':'Feature'}</button><button class="g s" data-a="ext" data-id="${j.id}">+7 days</button><button class="g s" data-a="del" data-id="${j.id}" style="color:var(--bad)">Remove</button></div></td></tr>`).join('')}</table></div></div>`};
A.japp=s=>{const[i,st]=s.split(':'),j=jb(i);j.st=st;if(st=='open'){announceJob(j);note(j.eid,`Your job "${j.title}" was approved and is live.`,'myjobs')}else note(j.eid,`Your job "${j.title}" was not approved. Please contact Yantriki.`,'myjobs');logA(`${st=='open'?'Approved':'Rejected'} job ${j.title}`);save();render()};
A.rdis=i=>{(D.reports.find(r=>r.id==i)||{}).open=false;save();render()};
A.feat=i=>{jb(i).feat=!jb(i).feat;logA(`${jb(i).feat?'Featured':'Unfeatured'} ${jb(i).title}`);save();render()};
A.ext=i=>{const j=jb(i),d=new Date((j.deadline||new Date().toISOString().slice(0,10))+'T00:00:00');d.setDate(d.getDate()+7);j.deadline=d.toISOString().slice(0,10);if(j.st=='closed')j.st='open';logA(`Extended ${j.title}`);save();render()};
A.xlj=()=>xl('yantriki-jobs',{Jobs:[['Title','Company','Category','Type','Mode','Location','Min','Max','Status','Views','Applicants','Posted'],...D.jobs.map(j=>[j.title,who(by(j.eid)),j.cat,j.type,j.mode,j.loc,j.min,j.max,isOpen(j)?'Open':j.st,j.views||0,D.apps.filter(a=>a.jobId==j.id).length,fd(j.t)])]});
V.eventsm=()=>V.events();
V.reviews=()=>`<div class="wrap"><div class="ban"><h2>Reviews</h2><p>Moderate company reviews.</p></div>${[...D.reviews].sort((a,b)=>b.t-a.t).map(r=>`<div class="card row"><div class="sp">${stars(r.rating)} <b>${e(r.title)}</b> <span class="mut">for ${e(who(by(r.cid)))}</span><p class="mut" style="margin:4px 0 0">${e(r.text)}</p></div><button class="g s" data-a="rvdel" data-id="${r.id}" style="color:var(--bad)">Delete</button></div>`).join('')||emp('No reviews.')}</div>`;
A.rvdel=i=>{D.reviews=D.reviews.filter(r=>r.id!=i);logA('Deleted a review');save();render()};
/* broadcast, platform, log, data */
V.broadcast=()=>`<div class="wrap"><div class="ban"><h2>Broadcast</h2><p>Send notifications to groups and show a banner across the site.</p></div><div class="two"><form class="card" data-f="bc"><h3 class="mb">Send a notification</h3><label>Audience</label><select name="aud"><option value="all">Everyone</option><option value="employee">Job seekers</option><option value="employer">Employers</option><option value="form">Registered via Google Form</option><option value="unv">Job seekers not verified</option></select><label>Message</label><textarea name="msg" required></textarea><label>Opens</label><select name="go"><option value="dash">Dashboard</option><option value="jobs">Find jobs</option><option value="events">Events</option><option value="profile">My profile</option></select><button>Send now</button></form>
<form class="card" data-f="ann"><h3 class="mb">Site-wide banner</h3><label>Banner text (leave empty to hide)</label><input name="t" value="${e(D.cfg.banner||'')}" placeholder="e.g. Walk-in drive this Saturday in Indore"><button>Save banner</button></form></div></div>`;
F.bc=f=>{const a=f.aud.value,l=D.users.filter(u=>u.role!='admin'&&(a=='all'||(a=='form'?u.src=='form':a=='unv'?u.role=='employee'&&!u.verified:u.role==a)));l.forEach(u=>note(u.id,f.msg.value,f.go.value));logA(`Broadcast to ${l.length} user(s): ${f.msg.value.slice(0,50)}`);save();toast(`Sent to ${l.length} user(s)`);f.msg.value=''};
F.ann=f=>{D.cfg.banner=f.t.value.trim();logA('Updated site banner');save();toast('Banner saved');render()};
V.platform=()=>{const c=D.cfg;return `<div class="wrap"><div class="ban"><h2>Platform settings</h2><p>Control sign-ups, approvals and categories.</p></div><div class="two"><form class="card" data-f="plat"><h3 class="mb">Rules</h3>${[['closeEmp','Close job seeker sign-ups'],['closeEr','Close employer sign-ups'],['jobApproval','Require admin approval for new jobs'],['autoConn','Auto-accept every connection request (nobody has to approve)']].map(([k,l])=>`<label class="tg" style="display:flex;margin:10px 0"><input type="checkbox" name="${k}" ${c[k]?'checked':''}> ${l}</label>`).join('')}<button class="mt">Save settings</button></form>
<div><form class="card" data-f="cat"><h3 class="mb">Job categories</h3><p>${CATS.map(x=>`<span class="chip">${e(x)}</span>`).join('')}</p><label>Add a category</label><input name="c" required><button>Add category</button></form><form class="card" data-f="pw"><h3 class="mb">Admin password</h3><label>Current password</label><input name="cur" type="password" required><label>New password</label><input name="nw" type="password" minlength="4" required><button>Update password</button></form></div></div></div>`};
F.plat=f=>{['closeEmp','closeEr','jobApproval','autoConn'].forEach(k=>D.cfg[k]=f[k].checked);logA('Updated platform settings');save();toast('Settings saved')};
F.cat=f=>{const c=f.c.value.trim();if(!c||CATS.includes(c))return toast('Enter a new category');CATS.push(c);D.cfg.cats.push(c);logA('Added category '+c);save();toast('Category added');render()};
let LG='';
V.log=()=>`<div class="wrap"><div class="ban"><h2>Activity log</h2><p>Every admin action, newest first.</p></div><form class="row mb" data-f="lg"><input name="q" value="${e(LG)}" placeholder="Search the log" style="max-width:300px;margin:0"><button>Search</button></form><div class="card" style="overflow-x:auto"><table><tr><th>When</th><th>Who</th><th>Action</th></tr>${D.log.filter(l=>!LG||l.text.toLowerCase().includes(LG.toLowerCase())).slice(0,150).map(l=>`<tr><td class="mut">${fdt(l.t)}</td><td>${e(l.by)}</td><td>${e(l.text)}</td></tr>`).join('')||'<tr><td colspan=3 class="mut">Nothing logged yet.</td></tr>'}</table></div></div>`;
F.lg=f=>{LG=f.q.value;render()};
V.data=()=>`<div class="wrap"><div class="ban"><h2>Data and backup</h2><p>Your data lives in Firebase Firestore (free plan).</p></div><div class="two"><div class="card"><h3 class="mb">Excel export</h3><p class="mut">One workbook with Users, Jobs, Applications, Placements and Reviews.</p><button data-a="xlall">Download Excel workbook</button></div><div class="card"><h3 class="mb">JSON backup</h3><p class="mut">A copy of everything you can see as admin. Keep one regularly.</p><button class="g" data-a="export">Download backup (JSON)</button></div></div>
<div class="card"><h3 class="mb">Free plan limits</h3><p class="mut">Firestore free plan: 50,000 reads and 20,000 writes per day. Gmail sends about 100 verification emails per day. If you outgrow either, tell me and we will optimise or upgrade.</p></div></div>`;
A.xlall=()=>xl('yantriki-all',{Users:[['Name','Email','Role','Source','City','Verified','Joined'],...D.users.filter(u=>u.role!='admin').map(u=>[who(u),u.email,u.role,u.src=='form'?'Google Form':'Sign-up',(u.r||{}).city||u.city||'',u.verified?'Yes':'No',fd(u.t)])],Jobs:[['Title','Company','Category','Type','Location','Min','Max','Status','Views'],...D.jobs.map(j=>[j.title,who(by(j.eid)),j.cat,j.type,j.loc,j.min,j.max,isOpen(j)?'Open':j.st,j.views||0])],Applications:[['Candidate','Job','Company','Stage','Match %','Source','Applied'],...D.apps.map(a=>[(by(a.uid)||{}).name,(jb(a.jobId)||{}).title,who(by((jb(a.jobId)||{}).eid)),a.st,jb(a.jobId)&&by(a.uid)?match(jb(a.jobId),by(a.uid)):'',a.rec?'Yantriki':'Direct',fd(a.t)])],Placements:[['Candidate','Job','Company','Fee','Paid'],...hires().map(a=>[(by(a.uid)||{}).name,(jb(a.jobId)||{}).title,who(by((jb(a.jobId)||{}).eid)),fee(a),a.paid?'Yes':'No'])],Reviews:[['Company','Rating','Title','Review'],...D.reviews.map(r=>[who(by(r.cid)),r.rating,r.title,r.text])]});
A.export=()=>dl('yantriki-backup.json',JSON.stringify(D),'application/json');
/* ===== round 2 actions ===== */
let FF=null;
const FFDEF=[['phone','Mobile number'],['city','City'],['edu','Highest qualification'],['yrs','Years of experience'],['skills','Skills (comma separated)'],['headline','Role you are looking for'],['cur','Current salary (₹ / month)'],['pexp','Expected salary (₹ / month)'],['notice','Notice period'],['resume','Resume link (Google Drive or other)'],['summary','About you']];
const ffList=()=>Array.isArray(FF)&&FF.length?FF.filter(x=>!['email','name'].includes(x.k)):FFDEF.map(([k,h])=>({k,h}));
function ensureFF(){if(FF===null){FF='loading';api('formFields').then(r=>{FF=r.fields||[]}).catch(()=>{FF=[]}).then(()=>{if(R.v=='auth'||R.v=='onboard')schedRender()})}}
const ffInput=(x,i)=>{const n='ff'+i,k=x.k;if(k=='summary')return `<textarea name="${n}" style="min-height:64px"></textarea>`;
if(k=='notice')return `<select name="${n}"><option value="">Select</option>${NOTICE.map(o=>`<option>${o}</option>`).join('')}</select>`;
const t=k=='phone'?'tel':['yrs','cur','pexp'].includes(k)?'number':k=='resume'?'url':'text';return `<input name="${n}" type="${t}"${k=='phone'?' required':''}${t=='number'?' min="0" step="any"':''}>`};
const detailsHtml=()=>{ensureFF();if(FF==='loading')return '<p class="mut mt">Loading registration questions…</p>';return `<h3 class="mt mb" style="font-size:17px">Your details</h3><p class="mut">The same details as the Yantriki registration form, so employers can find you.</p>${ffList().map((x,i)=>`<label>${e(x.h)}</label>${ffInput(x,i)}`).join('')}`};
const ffCollect=g=>{const det={};ffList().forEach((x,i)=>{const v=String(g.get('ff'+i)||'').trim();if(v)det[x.k||('x:'+x.h)]=v});return det};
A.google=async()=>{const pr=new firebase.auth.GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});try{await auth.signInWithPopup(pr)}catch(x){if(x.code=='auth/popup-blocked')return auth.signInWithRedirect(pr);if(x.code=='auth/popup-closed-by-user'||x.code=='auth/cancelled-popup-request')return;toast(x.code=='auth/unauthorized-domain'?'Add this website domain in Firebase: Authentication, Settings, Authorized domains.':x.code=='auth/operation-not-allowed'?'Google sign-in is not enabled in Firebase yet.':x.message)}};
V.onboard=()=>{const ep=AS.role=='employer';return `<div class="auth"><section class="ap"><h1>One last step.</h1><p>Tell us how you will use Yantriki Careers. You can add the rest of your details afterwards.</p></section><section class="af"><div><h2 style="font-size:30px">Finish your account</h2><p class="mut">Signed in as <b>${e((ONB||{}).email||'')}</b></p><div class="seg"><button data-a="role" data-id="employee" class="${ep?'':'on'}">Job seeker</button><button data-a="role" data-id="employer" class="${ep?'on':''}">Employer</button></div><form data-f="onboard"><label>Your name</label><input name="name" required value="${e((ONB||{}).name||'')}">${ep?'<label>Company name</label><input name="company" required>':detailsHtml()}<button style="width:100%;padding:12px">Continue</button></form><p class="mut c mt"><a data-a="out">Cancel and sign out</a></p></div></section></div>`};
F.onboard=async f=>{const g=new FormData(f);toast('Setting up your account…');await api('googleSetup',{role:AS.role,name:g.get('name'),company:g.get('company')||'',details:AS.role=='employee'?ffCollect(g):{}},true);const u=auth.currentUser;ONB=null;R={v:'home',p:{}};await bootUser(u)};
A.qapply=i=>{const j=jb(i);if(!j||D.apps.some(a=>a.jobId==i&&a.uid==P.id))return;if(comp(P)<30){toast('Add a few profile details first, then apply.');return nav('profile')}
D.apps.push({id:i+'_'+P.id,eid:j.eid,jobId:i,uid:P.id,st:'Applied',note:'',ans:[],t:Date.now(),ev:[{s:'Applied',t:Date.now()}]});j.apc=(j.apc||0)+1;note(j.eid,`${P.name} applied for ${j.title}.`,'applicants');save();toast('Applied with your profile');render()};
A.wa=i=>{const j=jb(i);window.open('https://wa.me/?text='+encodeURIComponent(`${j.title} at ${who(by(j.eid))} (${j.loc}) - ${location.href.split('#')[0]}#job=${i}`),'_blank','noopener')};
/* ===== events wiring ===== */
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b||b.tagName=='INPUT'&&b.type!='checkbox')return;if(b.tagName=='A')ev.preventDefault();try{Promise.resolve(A[b.dataset.a](b.dataset.id,b)).catch(x=>toast(x.message))}catch(x){toast(x.message)}});
document.addEventListener('submit',ev=>{const f=ev.target;if(!f.dataset.f)return;ev.preventDefault();Promise.resolve().then(()=>F[f.dataset.f](f)).catch(x=>toast(x.message))});
document.addEventListener('input',ev=>{const f=ev.target.closest&&ev.target.closest('form');if(f&&f.dataset.f=='profile'&&$('rp'))$('rp').innerHTML=resHtml({...P,r:collect(f).r})});
document.addEventListener('dragstart',ev=>{const c=ev.target.closest&&ev.target.closest('[data-drag]');if(c)ev.dataTransfer.setData('text/plain',c.dataset.drag)});
document.addEventListener('dragover',ev=>{if(ev.target.closest&&ev.target.closest('.kc'))ev.preventDefault()});
document.addEventListener('drop',ev=>{const k=ev.target.closest&&ev.target.closest('.kc');if(!k)return;ev.preventDefault();const id=ev.dataTransfer.getData('text/plain');if(id&&k.dataset.col){let why;if(k.dataset.col=='Rejected')why=prompt('Reason (optional, shared with the candidate)','')||'';setSt(id,k.dataset.col,why);render()}});
$('dlg').addEventListener('cancel',ev=>{if($('dlg').dataset.lock)ev.preventDefault()});
document.addEventListener('change',ev=>{const t=ev.target,d=t.dataset;
if(d.auto!=null&&t.form){t.form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));return}
if(d.mv){let why;if(t.value=='Rejected')why=prompt('Reason (optional, shared with the candidate)','')||'';setSt(d.mv,t.value,why);if($('dlg').open)$('dlg').close();toast('Stage updated');render();return}
if(d.fee){const a=D.apps.find(x=>x.id==d.fee);a.fee=+t.value||0;logA(`Set placement fee ₹${a.fee} for ${(by(a.uid)||{}).name}`);save();render();return}
if(d.paid){const a=D.apps.find(x=>x.id==d.paid);a.paid=t.checked;logA(`Marked fee ${a.paid?'paid':'unpaid'} for ${(by(a.uid)||{}).name}`);save();render();return}
if(d.file!=null&&t.files[0]){const fl=t.files[0];if(fl.size>2e6)return toast('File is too large. Keep it under 2 MB.');toast('Uploading…');const rd=new FileReader();rd.onload=async()=>{try{const r=await api('uploadResume',{name:fl.name,mime:fl.type,data:String(rd.result).split(',')[1]},true);P.r=P.r||{};P.r.file={name:r.name,url:r.url};save();toast('Resume uploaded');render()}catch(x){toast(x.message)}};rd.readAsDataURL(fl)}});
/* ===== boot ===== */
const hm=location.hash.match(/job=(\w+)/);R=hm?{v:'jd',p:{id:hm[1]}}:{v:'home',p:{}};history.replaceState(R,'');
startPublic();render();
</script></body></html>
